# Production stack: the Allfixx Code server behind Caddy (automatic HTTPS).
# Configure with deploy/.env (created by install.sh).
services:
  nova:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      # Must be the same path on the host: sandboxes are sibling containers
      # and the host's Docker daemon resolves their bind mounts.
      NOVA_DATA_DIR: /srv/nova
    volumes:
      - /srv/nova:/srv/nova
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8787"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [nova]
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
