<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<title>NOVA Cloud Agent</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #faf9f5; --sidebar: #f3f1e8; --panel: #ffffff; --soft: #f0eee6; --hover: #eae7dc; --border: #e5e2d6;
    --text: #1f1e1d; --muted: #75736b; --accent: #d97757; --accent-strong: #c2603f; --accent-soft: #f6e3da;
    --ok: #4d8a5e; --err: #bf4d43; --add-bg: #e6f2e4; --add-fg: #2f5d36; --del-bg: #f8e3e0; --del-fg: #8a3128; --hunk: #efece2;
    --code-bg: #f5f3ec; --shadow: 0 1px 2px rgba(31, 30, 29, .04), 0 4px 18px rgba(31, 30, 29, .06);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, Cambria, "Times New Roman", serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #262624; --sidebar: #1f1e1d; --panel: #30302e; --soft: #393937; --hover: #3a3936; --border: #41403c;
    --text: #f3f1ea; --muted: #a39f95; --accent: #d97757; --accent-strong: #e08868; --accent-soft: #4a352c;
    --ok: #7fbf8e; --err: #e58277; --add-bg: #253529; --add-fg: #a9d8b2; --del-bg: #3d2724; --del-fg: #f0aba2; --hunk: #34332f;
    --code-bg: #2b2a28; --shadow: 0 1px 2px rgba(0, 0, 0, .2), 0 6px 20px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #262624; --sidebar: #1f1e1d; --panel: #30302e; --soft: #393937; --hover: #3a3936; --border: #41403c;
      --text: #f3f1ea; --muted: #a39f95; --accent: #d97757; --accent-strong: #e08868; --accent-soft: #4a352c;
      --ok: #7fbf8e; --err: #e58277; --add-bg: #253529; --add-fg: #a9d8b2; --del-bg: #3d2724; --del-fg: #f0aba2; --hunk: #34332f;
      --code-bg: #2b2a28; --shadow: 0 1px 2px rgba(0, 0, 0, .2), 0 6px 20px rgba(0, 0, 0, .25);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
  button { font: inherit; cursor: pointer; color: var(--text); background: transparent; border: 1px solid var(--border); border-radius: 10px; padding: 6px 12px; transition: background .15s, border-color .15s, color .15s; }
  button:hover { background: var(--soft); }
  button:disabled { opacity: .45; cursor: default; background: transparent; }
  button.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.accent:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  button.accent:disabled { background: var(--accent); }
  button.icon-btn { width: 34px; height: 34px; padding: 0; display: inline-grid; place-items: center; border-color: transparent; color: var(--muted); flex: none; }
  button.icon-btn:hover { color: var(--text); background: var(--hover); }
  button.icon-btn svg { width: 18px; height: 18px; }
  textarea, input { font: inherit; color: var(--text); background: transparent; border: 0; outline: none; width: 100%; }
  ::placeholder { color: var(--muted); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  textarea:focus-visible, input:focus-visible { outline: none; }
  svg.i { width: 18px; height: 18px; flex: none; }

  .app { display: flex; height: 100%; height: 100dvh; }

  /* ---------- Left: sidebar ---------- */
  aside { width: 280px; flex: none; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; transition: width .2s ease; overflow: hidden; }
  .side-top { display: flex; align-items: center; justify-content: space-between; padding: 12px 10px 8px 16px; min-height: 58px; }
  .brand { display: flex; align-items: center; gap: 9px; white-space: nowrap; }
  .brand .mark { width: 24px; height: 24px; color: var(--accent); flex: none; }
  .brand b { font-family: var(--serif); font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
  .nav { padding: 2px 8px 8px; display: flex; flex-direction: column; gap: 2px; }
  .nav-item { display: flex; align-items: center; gap: 10px; border: 0; padding: 7px 10px; border-radius: 10px; width: 100%; text-align: left; white-space: nowrap; color: var(--text); }
  .nav-item:hover { background: var(--hover); }
  .nav-item .plus { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; margin-left: -2px; }
  .nav-item .plus svg { width: 14px; height: 14px; }
  .nav-item.new { font-weight: 500; color: var(--accent-strong); }
  .search { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 10px; color: var(--muted); }
  .search:focus-within { background: var(--panel); box-shadow: var(--shadow); color: var(--text); }
  .search input { font-size: 14px; padding: 0; }
  .task-list { overflow-y: auto; flex: 1; padding: 0 8px 8px; }
  .group-label { font-size: 12px; color: var(--muted); padding: 12px 10px 4px; white-space: nowrap; }
  .task-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 10px; cursor: pointer; margin-bottom: 1px; color: inherit; text-decoration: none; }
  .task-item:hover { background: var(--hover); }
  .task-item.active { background: var(--panel); box-shadow: var(--shadow); }
  .task-item .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; flex: 1; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--muted); flex: none; }
  .dot.running, .dot.queued { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  .dot.completed { background: var(--ok); } .dot.failed { background: var(--err); }
  @keyframes pulse { 50% { opacity: .3; } }
  .empty-list { color: var(--muted); font-size: 13px; padding: 10px; }
  .profile { border-top: 1px solid var(--border); padding: 10px 10px 12px; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--text); color: var(--bg); display: grid; place-items: center; font-weight: 600; font-size: 14px; flex: none; }
  .profile .who { flex: 1; min-width: 0; line-height: 1.3; }
  .profile .who b { font-weight: 500; font-size: 14px; display: block; }
  .profile .who small { color: var(--muted); font-size: 12px; display: block; overflow: hidden; text-overflow: ellipsis; }

  /* Collapsed rail (desktop only) */
  @media (min-width: 769px) {
    .app.collapsed aside { width: 60px; }
    .app.collapsed .side-top { flex-direction: column; gap: 8px; padding: 12px 0 8px; }
    .app.collapsed .brand b, .app.collapsed .nav-item .lbl, .app.collapsed .search input,
    .app.collapsed .task-list, .app.collapsed .profile .who, .app.collapsed .profile .theme { display: none; }
    .app.collapsed .nav { align-items: center; }
    .app.collapsed .nav-item, .app.collapsed .search { width: 40px; justify-content: center; padding: 8px 0; cursor: pointer; }
    .app.collapsed .profile { justify-content: center; padding: 12px 0; margin-top: auto; }
  }

  /* ---------- Right: main area ---------- */
  :root { --kw: #2f6fb0; --sub: #b5651d; --str: #3f7d3a; }
  :root[data-theme="dark"] { --kw: #82b4ea; --sub: #e3a369; --str: #9fce92; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --kw: #82b4ea; --sub: #e3a369; --str: #9fce92; } }

  main { flex: 1; display: flex; min-width: 0; min-height: 0; }
  .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .column { width: min(760px, 100%); margin: 0 auto; }

  /* Top bar: side | centered title | side */
  .topbar { display: grid; grid-template-columns: 220px minmax(0, 1fr) 220px; align-items: center; padding: 10px 12px; min-height: 64px; }
  .tb-side { display: flex; align-items: center; gap: 2px; }
  .tb-side.right { justify-content: flex-end; }
  .topbar .title { text-align: center; min-width: 0; line-height: 1.3; }
  .topbar .title div { font-size: 16.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .title small { color: var(--muted); font-size: 13.5px; display: flex; gap: 6px; align-items: center; justify-content: center; white-space: nowrap; overflow: hidden; }
  .changes-btn { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; padding: 6px 10px; border-color: transparent; position: relative; }
  .changes-btn:hover { background: var(--hover); }
  .changes-btn svg { width: 20px; height: 20px; }
  .changes-btn .count { font-size: 12.5px; white-space: nowrap; }
  .changes-btn .count b { color: var(--add-fg); font-weight: 600; } .changes-btn .count i { color: var(--del-fg); font-style: normal; font-weight: 600; }
  .changes-btn.on { background: var(--panel); box-shadow: var(--shadow); }
  .changes-btn .badge { display: none; position: absolute; top: 5px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg); }
  .mobile-only { display: none !important; }
  .menu-wrap { position: relative; }
  .dropdown { position: absolute; right: 0; top: 40px; z-index: 12; min-width: 190px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; display: none; }
  .dropdown.open { display: block; }
  .dropdown button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; text-align: left; padding: 8px 10px; font-size: 14px; }
  .dropdown button svg { width: 17px; height: 17px; color: var(--muted); }
  .dropdown button.danger, .dropdown button.danger svg { color: var(--err); }

  /* Composer: suggestion chip, text, then + / model pill / mic / send */
  .composer { background: var(--panel); border: 1px solid var(--border); border-radius: 28px; box-shadow: var(--shadow); padding: 16px 12px 12px 18px; transition: border-color .15s; }
  .composer:focus-within { border-color: color-mix(in srgb, var(--text) 18%, var(--border)); }
  .composer textarea { resize: none; min-height: 28px; max-height: 240px; display: block; padding: 2px 6px 2px 2px; font-size: 16px; line-height: 1.5; }
  .suggest { display: none; align-items: center; gap: 10px; margin: 0 0 10px; }
  .suggest.show { display: flex; }
  .suggest .s-text { color: var(--muted); font-size: 16px; }
  .suggest button { width: 30px; height: 26px; padding: 0; display: grid; place-items: center; border-radius: 999px; color: var(--muted); }
  .suggest button svg { width: 14px; height: 14px; }
  .composer .bar { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .composer .extras { display: none; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .composer.show-extras .extras { display: flex; }
  .round { width: 44px; height: 44px; padding: 0; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .round svg { width: 20px; height: 20px; }
  .plus-btn { border: 1px solid var(--border); color: var(--text); }
  .composer.show-extras .plus-btn { color: var(--accent-strong); border-color: var(--accent); background: var(--accent-soft); }
  .model-pill { height: 44px; padding: 0 18px; border-radius: 999px; background: var(--soft); border: 0; font-size: 15px; white-space: nowrap; display: inline-flex; align-items: center; cursor: default; }
  .model-pill:hover { background: var(--soft); }
  .bar .spacer { flex: 1; min-width: 0; }
  .mic { background: var(--soft); border: 0; color: var(--text); }
  .mic:hover { background: var(--hover); }
  .mic.on { background: var(--accent-soft); color: var(--accent-strong); animation: pulse 1.2s ease-in-out infinite; }
  .send { background: var(--accent); border: 0; color: #fff; }
  .send:hover { background: var(--accent-strong); }
  .send.idle { opacity: .5; }
  .send.idle:hover { background: var(--accent); }
  .chip { display: flex; align-items: center; gap: 6px; background: var(--soft); border-radius: 999px; padding: 6px 14px; min-width: 0; flex: 1 1 260px; }
  .chip svg { width: 14px; height: 14px; color: var(--muted); flex: none; }
  .chip input { font-size: 14px; padding: 2px 0; min-width: 0; }
  .chip.branch { flex: 0 1 180px; }
  .repo-tag { font-size: 13px; color: var(--muted); background: var(--soft); border-radius: 999px; padding: 4px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

  .welcome { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 24px 16px 12vh; overflow-y: auto; }
  .welcome h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(28px, 4vw, 40px); letter-spacing: -.02em; line-height: 1.2; text-align: center; margin: 0 0 28px; display: flex; align-items: center; justify-content: center; gap: 14px; }
  .welcome h1 svg { width: 34px; height: 34px; color: var(--accent); flex: none; }
  .welcome .composer textarea { min-height: 56px; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .suggestions button { font-size: 13.5px; color: var(--muted); border-radius: 999px; padding: 6px 14px; background: var(--panel); display: inline-flex; gap: 6px; align-items: center; }
  .suggestions button svg { width: 14px; height: 14px; }
  .suggestions button:hover { color: var(--text); }

  /* Conversation */
  .pane { flex: 1; overflow-y: auto; padding: 8px 20px 16px; min-height: 0; }
  .timeline { display: flex; flex-direction: column; gap: 16px; padding-bottom: 8px; }
  .ev-user { align-self: flex-end; background: var(--soft); padding: 11px 18px; border-radius: 22px; max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 16px; }
  .ev-msg { overflow-wrap: anywhere; font-size: 16.5px; line-height: 1.7; }
  .ev-msg p { margin: 0 0 .8em; } .ev-msg p:last-child { margin-bottom: 0; }
  .ev-msg ul, .ev-msg ol { margin: 0 0 .8em; padding-left: 1.3em; }
  .ev-msg li { margin: .2em 0; padding-left: .2em; }
  .ev-msg strong { font-weight: 650; }
  .ev-msg code { font-family: var(--mono); font-size: .86em; color: var(--kw); background: var(--soft); border-radius: 6px; padding: 2px 6px; }
  .ev-msg h3 { font-family: var(--serif); font-weight: 600; font-size: 1.15em; margin: .7em 0 .3em; }
  .ev-msg > .codecard { margin: 4px 0 .9em; }
  .msg-actions { display: flex; gap: 4px; margin-top: 10px; }
  .msg-actions button { width: 34px; height: 34px; }
  .ev-think { color: var(--muted); font-size: 14px; white-space: pre-wrap; border-left: 2px solid var(--border); padding: 2px 0 2px 12px; }
  .ev-think::before { content: "Thinking"; display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; opacity: .8; margin-bottom: 2px; }
  .ev-log { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .ev-log::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--border); flex: none; }
  .ev-status { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ev-status.failed { color: var(--err); } .ev-status.completed { color: var(--ok); }
  .ev-status button { font-size: 13px; padding: 4px 12px; color: var(--text); border-radius: 999px; }
  .working { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
  .working svg { width: 22px; height: 22px; color: var(--accent); animation: spin 2.4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .live { opacity: .8; white-space: pre-wrap; }

  /* Code card (message code blocks and tool calls) */
  .codecard { background: var(--soft); border-radius: 18px; overflow: hidden; }
  .cc-head { display: flex; align-items: center; gap: 4px; padding: 8px 8px 8px 18px; }
  .cc-label { flex: 1; min-width: 0; color: var(--muted); font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cc-label b { color: var(--text); font-weight: 500; }
  .cc-head button { width: 34px; height: 34px; }
  .cc-body { margin: 0; padding: 4px 18px 16px; overflow-x: auto; white-space: pre; font-family: var(--mono); font-size: 14px; line-height: 1.6; word-break: normal; max-height: 360px; }
  .cc-body code { font: inherit; color: var(--text); background: none; padding: 0; }
  .tk-k { color: var(--kw); } .tk-sub { color: var(--sub); } .tk-s { color: var(--str); }
  .tk-f, .tk-o { color: var(--muted); } .tk-c { color: var(--muted); font-style: italic; }
  .codecard.expanded { position: fixed; inset: max(12px, env(safe-area-inset-top)) 12px 12px; z-index: 30; display: flex; flex-direction: column; box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .4); background: var(--panel); }
  .codecard.expanded .cc-body { flex: 1; max-height: none; }
  details.cc-out { border-top: 1px solid var(--border); }
  details.cc-out summary { list-style: none; cursor: pointer; padding: 8px 18px; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  details.cc-out summary::-webkit-details-marker { display: none; }
  details.cc-out summary::before { content: "›"; display: inline-block; transition: transform .15s; }
  details.cc-out[open] summary::before { transform: rotate(90deg); }
  details.cc-out.err summary { color: var(--err); }
  details.cc-out pre { margin: 0; padding: 0 18px 14px; font-family: var(--mono); font-size: 13px; white-space: pre-wrap; word-break: break-word; max-height: 360px; overflow: auto; color: var(--muted); }
  .tool-line { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  .tool-line svg { width: 16px; height: 16px; }
  .tool-line code { font-family: var(--mono); font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool-line.err { color: var(--err); }

  .followup { padding: 6px 16px calc(12px + env(safe-area-inset-bottom)); }

  /* Right-hand Changes panel */
  .panel { width: 0; flex: none; overflow: hidden; border-left: 1px solid transparent; background: var(--panel); display: flex; flex-direction: column; transition: width .22s ease; }
  main.panel-open .panel { width: min(46vw, 720px); border-left-color: var(--border); }
  .panel-inner { width: min(46vw, 720px); min-width: 0; display: flex; flex-direction: column; height: 100%; }
  .panel-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 18px; min-height: 64px; border-bottom: 1px solid var(--border); }
  .panel-head .ttl { flex: 1; min-width: 0; line-height: 1.3; }
  .panel-head .ttl b { font-weight: 600; font-size: 16.5px; display: block; }
  .panel-head .ttl small { color: var(--muted); font-size: 13px; }
  .panel-actions { display: flex; gap: 8px; padding: 10px 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .panel-actions button { font-size: 14px; border-radius: 999px; padding: 7px 16px; }
  .panel-body { flex: 1; overflow: auto; padding: 14px 18px calc(14px + env(safe-area-inset-bottom)); }
  .diff .file { border-radius: 16px; margin-bottom: 14px; overflow: hidden; background: var(--soft); }
  .diff .fname { padding: 10px 16px; font-family: var(--mono); font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
  .diff .fname span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .diff .fname span:last-child { color: var(--muted); flex: none; }
  .diff pre { overflow-x: auto; white-space: pre; font-family: var(--mono); font-size: 13px; margin: 0; padding-bottom: 8px; }
  .diff .ln { display: block; padding: 0 16px; min-height: 1.6em; }
  .diff .a { background: var(--add-bg); color: var(--add-fg); } .diff .d { background: var(--del-bg); color: var(--del-fg); }
  .diff .h { color: var(--muted); }
  .muted { color: var(--muted); }
  .scrim { display: none; }
  .modal-back { position: fixed; inset: 0; background: rgba(0, 0, 0, .4); z-index: 35; display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal-back.open { display: flex; }
  .modal { background: var(--panel); border-radius: 22px; box-shadow: var(--shadow); width: min(440px, 100%); padding: 22px; position: relative; }
  .modal h2 { font-family: var(--serif); font-weight: 500; font-size: 22px; margin: 0 0 6px; }
  .modal p { color: var(--muted); margin: 0 0 14px; font-size: 14.5px; }
  .modal .x { position: absolute; top: 12px; right: 12px; }
  .modal .url { display: flex; align-items: center; gap: 8px; background: var(--soft); border-radius: 14px; padding: 10px 10px 10px 16px; margin-bottom: 10px; }
  .modal .url code { flex: 1; min-width: 0; font-family: var(--mono); font-size: 15px; overflow-wrap: anywhere; }
  .modal .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .modal .row button { border-radius: 999px; font-size: 14px; padding: 8px 16px; }
  .modal .codecard { margin: 6px 0 12px; }
  .toast { position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 14px; z-index: 40; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }

  @media (max-width: 1000px) {

  const frag = document.createDocumentFragment();

  const pre = h("pre", "cc-body"); const c = h("code");
  if (shell) c.append(highlightShell(code)); else c.textContent = code;
  pre.append(c); card.append(head, pre);
  return card;
}

// Minimal, safe Markdown: escape everything first, add a fixed set of tags,
// and swap fenced code for code cards built from text nodes.
function renderMarkdown(src) {
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inline = (s) => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  const out = [], blocks = []; const lines = src.split("\n"); let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (line.startsWith("```")) {
      const lang = line.slice(3).trim(); const code = []; i++;
      while (i < lines.length && !lines[i].startsWith("```")) code.push(lines[i++]);
      i++; blocks.push({ lang, code: code.join("\n") }); out.push(`<div data-code="${blocks.length - 1}"></div>`); continue;
    }
    const heading = /^(#{1,3})\s+(.*)$/.exec(line);
    if (heading) { out.push(`<h3>${inline(heading[2])}</h3>`); i++; continue; }
    if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
      const ordered = /^\s*\d+\./.test(line); const items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) items.push(`<li>${inline(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, ""))}</li>`);
      out.push(`<${ordered ? "ol" : "ul"}>${items.join("")}</${ordered ? "ol" : "ul"}>`); continue;
    }
    if (!line.trim()) { i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^(```|#{1,3}\s|\s*([-*]|\d+\.)\s+)/.test(lines[i])) para.push(lines[i++]);
    out.push(`<p>${inline(para.join("\n")).replace(/\n/g, "<br>")}</p>`);
  }
  const el = h("div", "ev-msg"); el.innerHTML = out.join("");
  el.querySelectorAll("[data-code]").forEach((ph) => {
    const b = blocks[+ph.dataset.code];
    ph.replaceWith(codeCard(langLabel(b.lang || "bash"), b.code, { shell: SHELL.has(b.lang.toLowerCase()) }));
  });
  return el;
}

function autosize(ta) { const fit = () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 240) + "px"; }; ta.addEventListener("input", fit); fit(); }

function diffStats(diff) {
  const files = diff.split(/^(?=diff --git )/m).filter((c) => c.trim());
  let adds = 0, dels = 0;
  for (const l of diff.split("\n")) { if (l.startsWith("+") && !l.startsWith("+++")) adds++; else if (l.startsWith("-") && !l.startsWith("---")) dels++; }
  return { files, adds, dels };
}

// The shared composer: optional suggestion, text, then + / model / mic / send.
function buildComposer({ placeholder, name = "prompt", withExtras = false }) {
  const form = h("form", "composer column");
  const suggest = h("div", "suggest"); const sText = h("span", "s-text"); const sGo = iconBtn("chev", "Use suggestion", "");
  suggest.append(sText, sGo);
  const input = h("textarea"); input.name = name; input.rows = 1; input.placeholder = placeholder;
  form.append(suggest, input);
  let extras = null;
  if (withExtras) {
    extras = h("div", "extras");
    const repo = h("label", "chip"); repo.append(icon("repo")); const ri = h("input"); ri.name = "repo_url"; ri.placeholder = "https://github.com/owner/repo"; repo.append(ri);
    const br = h("label", "chip branch"); br.append(icon("branch")); const bi = h("input"); bi.name = "branch"; bi.placeholder = "branch (optional)"; br.append(bi);
    extras.append(repo, br); form.append(extras);
  }
  const bar = h("div", "bar");
  const plus = iconBtn("plus", withExtras ? "Connect a repository" : "New task", "round plus-btn");
  const model = h("span", "model-pill", prettyModel(config.model)); model.dataset.model = "";
  const tag = h("span", "repo-tag"); tag.hidden = true;
  const mic = iconBtn("mic", "Dictate", "round mic");
  const send = h("button", "round send idle"); send.type = "submit"; send.append(icon("arrow")); send.setAttribute("aria-label", "Send");
  bar.append(plus, model, tag, h("span", "spacer"), mic, send);
  form.append(bar);

  const state = { busy: false };
  const refresh = () => send.classList.toggle("idle", !state.busy && !input.value.trim());
  input.addEventListener("input", refresh);
  const setSuggestion = (text, onUse) => {
    suggest.classList.toggle("show", !!text); sText.textContent = text || "";
    sGo.onclick = () => onUse && onUse();
  };
  const setBusy = (busy) => {
    state.busy = busy; send.replaceChildren(icon(busy ? "stop" : "arrow"));
    send.setAttribute("aria-label", busy ? "Stop" : "Send"); send.title = busy ? "Stop task" : ""; refresh();
  };

  // Voice input where the browser supports it.
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null;
  if (!SR) mic.hidden = true;
  else mic.onclick = () => {
    if (rec) { rec.stop(); return; }
    rec = new SR(); rec.lang = document.documentElement.lang === "bn" ? "bn-BD" : (navigator.language || "en-US"); rec.interimResults = false;
    rec.onresult = (e) => { const t = e.results[0][0].transcript; input.value += (input.value ? " " : "") + t; input.dispatchEvent(new Event("input")); };
    rec.onend = rec.onerror = () => { rec = null; mic.classList.remove("on"); };
    mic.classList.add("on"); rec.start();
  };
  return { form, input, send, plus, tag, extras, setSuggestion, setBusy, state };
}

// ---------- Left: task list grouped by date ----------
async function refreshList() {
  try { allTasks = await api("/api/tasks"); } catch { return; }
  renderList();
}
function renderList() {
  const q = $("#taskSearch").value.trim().toLowerCase();
  const tasks = allTasks.filter((t) => !q || t.title.toLowerCase().includes(q) || (t.repo_url || "").toLowerCase().includes(q));
  const list = $("#taskList"); list.replaceChildren();
  if (!tasks.length) { list.append(h("div", "empty-list", q ? "No matching tasks" : "Your tasks will show up here")); return; }
  const startOfToday = new Date(); startOfToday.setHours(0, 0, 0, 0);
  const t0 = startOfToday.getTime() / 1000;
  const groupOf = (ts) => ts >= t0 ? "Today" : ts >= t0 - 86400 ? "Yesterday" : ts >= t0 - 7 * 86400 ? "Previous 7 days" : "Older";
  let last = null;
  for (const t of tasks) {
    const g = groupOf(t.created_at);
    if (g !== last) { list.append(h("div", "group-label", g)); last = g; }
    const item = h("a", "task-item" + (current && current.id === t.id ? " active" : ""));
    item.href = "#" + t.id; item.title = t.title;
    item.append(h("span", "dot " + t.status), h("span", "t", t.title));
    list.append(item);
  }
}
$("#taskSearch").addEventListener("input", renderList);

// ---------- Right: task conversation + Changes panel ----------
async function showTask(id) {
  if (source) source.close();
  let task;
  try { task = await api("/api/tasks/" + id); } catch { location.hash = ""; return; }
  current = task;
  const main = $("#main"); main.className = ""; main.replaceChildren();

  // Top bar: back | title + subtitle | changes, menu
  const chat = h("div", "chat");
  const top = h("div", "topbar");
  const left = h("div", "tb-side");
  const back = iconBtn("back", "All tasks", "icon-btn mobile-only"); back.dataset.openSide = "";
  left.append(back);
  const title = h("div", "title"); title.append(h("div", null, task.title));
  const sub = h("small"); title.append(sub);
  const right = h("div", "tb-side right");
  const changesBtn = h("button", "changes-btn"); changesBtn.type = "button"; changesBtn.title = "Changes";
  const count = h("span", "count"); const badge = h("span", "badge");
  changesBtn.append(icon("pr"), h("span", "lbl", "Changes"), count, badge);
  const menuWrap = h("div", "menu-wrap");
  const dotsBtn = iconBtn("dots", "More");
  const dropdown = h("div", "dropdown");
  const stopItem = h("button"); stopItem.type = "button"; stopItem.append(icon("stop"), "Stop task");
  const themeItem = h("button"); themeItem.type = "button"; themeItem.append(icon("theme"), "Light / dark");
  const delItem = h("button", "danger"); delItem.type = "button"; delItem.append(icon("trash"), "Delete task");
  dropdown.append(stopItem, themeItem, delItem); menuWrap.append(dotsBtn, dropdown);
  dotsBtn.onclick = () => dropdown.classList.toggle("open");
  stopItem.onclick = () => { dropdown.classList.remove("open"); api(`/api/tasks/${id}/cancel`, { method: "POST" }); };
  themeItem.onclick = () => { dropdown.classList.remove("open"); toggleTheme(); };
  delItem.onclick = async () => { dropdown.classList.remove("open"); if (confirm("Delete this task and its workspace?")) { await api("/api/tasks/" + id, { method: "DELETE" }); location.hash = ""; refreshList(); } };
  right.append(changesBtn, menuWrap);
  top.append(left, title, right);

  const pane = h("div", "pane");
  const timeline = h("div", "timeline column"); pane.append(timeline);
  const working = h("div", "working"); working.append(icon("spark"), h("span", null, "NOVA is working…"));

  const foot = h("div", "followup");
  const c = buildComposer({ placeholder: "Reply to NOVA…", name: "message" });
  c.plus.onclick = () => { location.hash = ""; };
  foot.append(c.form);
  chat.append(top, pane, foot);

  // Changes panel (right)
  const panel = h("section", "panel"); const inner = h("div", "panel-inner");
  const phead = h("div", "panel-head"); const pttl = h("div", "ttl"); const pstat = h("small", null, "");
  pttl.append(h("b", null, "Changes"), pstat);
  const closeBtn = iconBtn("close", "Close changes");
  phead.append(pttl, closeBtn);
  const pactions = h("div", "panel-actions");
  const commitBtn = h("button", null, "Commit to branch"), pushBtn = h("button", "accent", "Commit & push");
  pactions.append(commitBtn, pushBtn);
  const pbody = h("div", "panel-body diff");
  inner.append(phead, pactions, pbody); panel.append(inner);
  main.append(chat, panel);

  const setPanel = (open) => { main.classList.toggle("panel-open", open); changesBtn.classList.toggle("on", open); if (open) loadDiff(); };
  changesBtn.onclick = () => setPanel(!main.classList.contains("panel-open"));
  closeBtn.onclick = () => setPanel(false);

  let busy = false, diffTimer = null, lastFiles = 0;
  async function loadDiff() {
    let diff = "";
    try { diff = (await api(`/api/tasks/${id}/diff`)).diff; } catch { return; }
    if (current !== task) return;
    const { files, adds, dels } = diffStats(diff);
    lastFiles = files.length;
    count.replaceChildren(); if (files.length) count.append(h("b", null, "+" + adds), " ", h("i", null, "−" + dels));
    badge.classList.toggle("has", files.length > 0);
    pstat.textContent = files.length ? `${files.length} file${files.length > 1 ? "s" : ""} changed · +${adds} −${dels}` : "No changes yet";
    commitBtn.disabled = !files.length || busy; pushBtn.disabled = !files.length || busy || !task.repo_url;
    updateSuggestion();
    if (!main.classList.contains("panel-open")) return;
    pbody.replaceChildren();
    if (!files.length) { pbody.append(h("div", "muted", "NOVA hasn't changed any files yet.")); return; }
    for (const chunk of files) {
      const lines = chunk.split("\n");
      const m = /^diff --git a\/(.*) b\/(.*)$/.exec(lines[0]);
      let fa = 0, fd = 0;
      for (const l of lines) { if (l.startsWith("+") && !l.startsWith("+++")) fa++; else if (l.startsWith("-") && !l.startsWith("---")) fd++; }
      const file = h("div", "file"); const name = h("div", "fname"); name.append(h("span", null, m ? m[2] : lines[0]), h("span", null, `+${fa} −${fd}`)); file.append(name);
      const pre = h("pre"); let started = false;
      for (const line of lines.slice(1)) {
        if (line.startsWith("@@")) started = true;
        if (!started) continue;
        const cls = line.startsWith("@@") ? "h" : line.startsWith("+") ? "a" : line.startsWith("-") ? "d" : "";
        pre.append(h("span", "ln " + cls, line || " "));
      }
      if (!started) pre.append(h("span", "ln muted", "(binary or mode change)"));
      file.append(pre); pbody.append(file);
    }
  }
  const scheduleDiff = () => { clearTimeout(diffTimer); diffTimer = setTimeout(loadDiff, 500); };
  const doCommit = async (push) => {
    const message = prompt("Commit message:", task.title); if (message === null) return;
    try { const r = await api(`/api/tasks/${id}/commit`, { method: "POST", body: JSON.stringify({ message, push }) }); toast(`Committed ${r.commit.slice(0, 8)}${r.pushed ? " and pushed" : ""}`); loadDiff(); }
    catch (err) { alert(err.message); }
  };
  commitBtn.onclick = () => doCommit(false); pushBtn.onclick = () => doCommit(true);

  // A context-aware suggestion inside the composer, like "Commit & push these changes ›".
  function updateSuggestion() {
    if (busy) return c.setSuggestion(null);
    if (task.status === "failed") return c.setSuggestion("Try again", () => { c.input.value = "Please try again."; c.input.dispatchEvent(new Event("input")); c.input.focus(); });
    if (lastFiles) return c.setSuggestion(task.repo_url ? "Commit & push these changes" : "Commit these changes", () => doCommit(!!task.repo_url));
    c.setSuggestion(null);
  }

  c.form.onsubmit = async (e) => {
    e.preventDefault();
    if (busy) { await api(`/api/tasks/${id}/cancel`, { method: "POST" }); return; }
    if (!c.input.value.trim()) return;
    try { await api(`/api/tasks/${id}/messages`, { method: "POST", body: JSON.stringify({ message: c.input.value }) }); c.input.value = ""; c.input.dispatchEvent(new Event("input")); }
    catch (err) { alert(err.message); }
  };
  c.input.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !isMobile()) { e.preventDefault(); if (!busy) c.form.requestSubmit(); } };
  autosize(c.input);

  const setStatus = (status) => {
    task.status = status;
    sub.replaceChildren();
    if (task.repo_url) sub.append(h("span", null, repoName(task.repo_url) + (task.branch ? " @ " + task.branch : "")), h("span", null, "·"));
    sub.append(h("span", "dot " + status), h("span", null, status));
    busy = status === "running" || status === "queued";
    c.setBusy(busy); stopItem.disabled = !busy;
    if (busy) timeline.append(working); else working.remove();
    updateSuggestion();
  };
  setStatus(task.status);
  loadDiff();

  // Replay the full log over SSE; it keeps streaming new events live.
  let live = null, liveKind = null, replaying = true, lastMsg = null;
  const toolEls = {};
  const add = (el) => { timeline.insertBefore(el, working.parentNode === timeline ? working : null); };
  const stick = () => { if (pane.scrollHeight - pane.scrollTop - pane.clientHeight < 240) pane.scrollTop = pane.scrollHeight; };
  const endLive = () => { if (live) { live.remove(); live = null; liveKind = null; } };
  const addActions = (msgEl) => {
    if (!msgEl || msgEl.querySelector(".msg-actions")) return;
    const row = h("div", "msg-actions");
    const copy = iconBtn("copy", "Copy"); copy.onclick = () => copyText(msgEl.dataset.raw, copy); row.append(copy);
    if ("speechSynthesis" in window) {
      const play = iconBtn("play", "Read aloud");
      play.onclick = () => {
        if (speechSynthesis.speaking) { speechSynthesis.cancel(); return; }
        speechSynthesis.speak(new SpeechSynthesisUtterance(msgEl.dataset.raw.replace(/[`*#]/g, "")));
      };
      row.append(play);
    }
    msgEl.append(row);
  };
  setTimeout(() => { replaying = false; pane.scrollTop = pane.scrollHeight; }, 400);

  const q = token ? `&token=${encodeURIComponent(token)}` : "";
  source = new EventSource(`/api/tasks/${id}/events?after=0${q}`);
  source.onmessage = (msg) => {
    const ev = JSON.parse(msg.data), d = ev.data;
    switch (ev.type) {
      case "text_delta": case "thinking_delta": {
        const kind = ev.type === "text_delta" ? "ev-msg" : "ev-think";
        if (!live || liveKind !== kind) { endLive(); live = h("div", kind + " live"); liveKind = kind; add(live); }
        live.textContent += d.text; break;
      }
      case "user": endLive(); add(h("div", "ev-user", d.text)); break;
      case "thinking": endLive(); add(h("div", "ev-think", d.text)); break;
      case "message": { endLive(); const el = renderMarkdown(d.text); el.dataset.raw = d.text; lastMsg = el; add(el); break; }
      case "log": add(h("div", "ev-log", d.text)); break;
      case "tool_call": {
        endLive();
        let el;
        if (d.name === "bash") {
          el = codeCard("Bash", d.input.restart ? "# restart shell" : d.input.command, { shell: true });
        } else {
          const verb = { view: "Read", create: "Write", str_replace: "Edit", insert: "Edit" }[d.input.command] || "Edit";
          const path = d.input.path || "";
          if (verb === "Read") {
            el = h("div", "tool-line"); const code = h("code", null, path);
            el.append(icon("file"), h("span", null, "Read"), code);
          } else {
            const body = d.input.file_text ?? d.input.insert_text ?? `- ${d.input.old_str ?? ""}\n+ ${d.input.new_str ?? ""}`;
            const lbl = document.createDocumentFragment(); lbl.append(verb + " · ", h("b", null, path.split("/").pop()));
            el = codeCard("", body, { labelNode: lbl });
          }
        }
        toolEls[d.id] = el; add(el); break;
      }
      case "tool_result": {
        const el = toolEls[d.id]; if (!el) break;
        if (el.classList.contains("tool-line")) { if (d.is_error) { el.classList.add("err"); el.title = d.output; } }
        else {
          const out = h("details", "cc-out" + (d.is_error ? " err" : ""));
          const exit = /\[exit code (\d+)\]\s*$/.exec(d.output);
          out.append(h("summary", null, d.is_error ? "Error" : exit ? `Output · exit ${exit[1]}` : "Output"), h("pre", null, d.output));
          if (d.is_error) out.open = true;
          el.append(out);
        }
        if (!replaying && !el.classList.contains("tool-line")) scheduleDiff();
        break;
      }
      case "status":
        endLive(); setStatus(d.status);
        if (d.status === "completed") {
          addActions(lastMsg);
          const s = h("div", "ev-status completed"); s.append(icon("check", "i"), h("span", null, "Task completed"));
          const view = h("button", null, "View changes"); view.onclick = () => setPanel(true); s.append(view); add(s);
          const wasLive = !replaying;
          loadDiff().then(() => { if (wasLive && lastFiles && !isMobile()) setPanel(true); });
        } else if (d.status === "failed") add(h("div", "ev-status failed", "Failed: " + (d.error || "unknown error")));
        else if (d.status === "cancelled") add(h("div", "ev-status", "Stopped"));
        refreshList(); break;
      case "commit": add(h("div", "ev-log", `Committed ${d.commit.slice(0, 8)} on ${d.branch}${d.pushed ? " and pushed" : ""}`)); break;
    }
    if (!replaying) stick();
  };
  renderList(); refreshList();
}

  back.classList.add("open");
}
$("#phoneBtn").onclick = showPhone;
$("#phoneModal").addEventListener("click", (e) => { if (e.target.id === "phoneModal") e.currentTarget.classList.remove("open"); });

function route() { app.classList.remove("side-open"); const id = location.hash.slice(1); id ? showTask(id) : showNew(); }
window.addEventListener("hashchange", route);
$("#newBtn").onclick = () => { if (location.hash) location.hash = ""; else route(); };
api("/api/config").then((c) => {
  config = c; $("#cfg").textContent = `${c.model} · ${c.sandbox} sandbox`;
  document.querySelectorAll("[data-model]").forEach((el) => { el.textContent = prettyModel(c.model); });
}).catch(() => {});
route();
setInterval(refreshList, 10000);
</script>
</body>
</html>
